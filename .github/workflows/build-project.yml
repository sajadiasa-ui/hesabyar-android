name: Generate Hesabyar Project

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download and run generator
        run: |
          curl -o create.py https://raw.githubusercontent.com/YOUR_USERNAME/hesabyar-android/main/create_hesabyar.py
          python create.py

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Hesabyar-Project
          path: Hesabyar.zip
